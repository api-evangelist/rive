description: >-
  Rive is an interactive design and animation platform and real-time graphics
  engine that lets designers, animators, and developers create, animate, and
  code interactive experiences in one place and ship them across every platform.
  Built around a State Machine design system and a GPU-accelerated vector
  renderer that draws at up to 120fps, Rive exports a single lightweight .riv
  file that is driven at runtime by open-source (MIT) native runtimes for Web,
  React, React Native, Flutter, iOS, Android, macOS, Unity, Unreal, and C++.
  Rive powers interactive UI, animation, and product experiences at companies
  including Spotify, Duolingo, Disney, and Google, reaching over 2 billion
  users. Rather than a hosted REST API, Rive's developer surface is its family
  of first-party runtime SDKs plus data binding, Luau scripting, and a CDN for
  share and embed hosting.
